version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: lisa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lisa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: lisa-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-lisa_secret_evolution_key}
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  redis_data:
  qdrant_data:
  evolution_instances:
